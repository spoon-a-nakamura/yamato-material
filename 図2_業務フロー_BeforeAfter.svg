<line x1="64" y1="140" x2="1058" y2="140" stroke="#d5d4ce"/>
<text x="64" y="168" font-size="18" font-weight="700" fill="#0b0b0b">Before ｜ 現在の流れ</text>
<text x="64" y="190" font-size="12.5" fill="#87867f">手作業が3工程あり、営業の時間を使っています</text>
