<text x="84" y="582" font-size="14" fill="#0b0b0b">提案候補を1件ずつ書き出し、資料を個別に集める</text>
<path d="M257.0,593 L264.0,601 L271.0,593" fill="none" stroke="#87867f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="64" y="606" width="400" height="52" rx="6" fill="#f3f2ef"/>
<rect x="64" y="606" width="5" height="52" rx="2.5" fill="#87867f"/>
<text x="84" y="638" font-size="14" fill="#0b0b0b">お客様へ送付</text>
<text x="560" y="168" font-size="18" font-weight="700" fill="#0b0b0b">After ｜ Webカタログ導入後</text>
<text x="560" y="190" font-size="12.5" fill="#87867f">3つの手作業がWebカタログ上で完結します</text>
