<text x="580" y="463" font-size="14" fill="#0b0b0b">素材で絞り込む</text>
<text x="948" y="440" font-size="11.5" font-weight="700" fill="#2a78d6">対応する機能</text>
<text x="948" y="458" font-size="12" fill="#52514e">絞り込み検索</text>
<text x="948" y="475" font-size="12" fill="#52514e">（最低限に含む）</text>
<path d="M738.0,481 L745.0,489 L752.0,481" fill="none" stroke="#87867f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="560" y="494" width="370" height="62" rx="6" fill="#eaf2fd"/>
<rect x="560" y="494" width="5" height="62" rx="2.5" fill="#2a78d6"/>
<text x="580" y="520" font-size="14" fill="#0b0b0b">簡易図面と仕様を一緒に確認</text>
<text x="580" y="539" font-size="14" fill="#0b0b0b">（メーカー情報は社内用アカウントのみ）</text>
<text x="948" y="516" font-size="11.5" font-weight="700" fill="#2a78d6">対応する機能</text>
<text x="948" y="534" font-size="12" fill="#52514e">① 図面の出し分け</text>
<text x="948" y="551" font-size="12" fill="#52514e">② メーカー情報の連携</text>
<path d="M738.0,557 L745.0,565 L752.0,557" fill="none" stroke="#87867f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="560" y="570" width="370" height="62" rx="6" fill="#eaf2fd"/>
<rect x="560" y="570" width="5" height="62" rx="2.5" fill="#2a78d6"/>
<text x="580" y="596" font-size="14" fill="#0b0b0b">候補を見積もりカゴにまとめ、</text>
<text x="580" y="615" font-size="14" fill="#0b0b0b">次回の連絡でそのまま呼び出す</text>
<text x="948" y="592" font-size="11.5" font-weight="700" fill="#2a78d6">対応する機能</text>
<text x="948" y="610" font-size="12" fill="#52514e">④ 見積もりカゴ</text>
<rect x="560" y="654" width="498" height="92" rx="6" fill="#ffffff" stroke="#d5d4ce"/>
<text x="576" y="679" font-size="14" font-weight="700" fill="#0b0b0b">残る手作業について</text>
<text x="576" y="700" font-size="12.5" fill="#52514e">・Webカタログに未掲載の商品についてのお問い合わせ</text>
<text x="576" y="719" font-size="12.5" fill="#52514e">・メーカーに図面を取り寄せる必要がある場合（1対1で揃っていない商品）</text>
<text x="576" y="738" font-size="12.5" fill="#87867f">すべてを置き換えるのではなく、頻度の高い作業から確実に減らす設計としています。</text>
<line x1="64" y1="752" x2="1058" y2="752" stroke="#d5d4ce"/>
<text x="64" y="774" font-size="11.5" fill="#87867f">ヤマトマテリアル株式会社 Webカタログ構築のご提案／スタジオスプーン株式会社</text>
