<rect x="64" y="276" width="400" height="52" rx="6" fill="#f3f2ef"/>
<rect x="64" y="276" width="5" height="52" rx="2.5" fill="#87867f"/>
<text x="84" y="308" font-size="14" fill="#0b0b0b">電話でのお問い合わせ（「100mlのペットボトルが欲しい」）</text>
