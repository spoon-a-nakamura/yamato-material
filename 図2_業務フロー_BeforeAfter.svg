<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1122 794" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="1122" height="794" fill="#fcfcfb"/>
<text x="64" y="58" font-size="26" font-weight="700" fill="#0b0b0b">図2　営業の業務はどう変わるか（Before → After）</text>
<text x="64" y="86" font-size="14" fill="#52514e">2026年8月12日のお打ち合わせで伺った、電話でのやり取りの流れにもとづいています。橙色の3つが、現在アナログで行われている作業です。</text>
<rect x="64" y="106" width="26" height="16" rx="4" fill="#fdeee7"/>
<rect x="64" y="106" width="4" height="16" rx="2" fill="#eb6834"/>
<text x="100" y="119" font-size="12.5" fill="#52514e">いま手作業で行われていること</text>
<rect x="364" y="106" width="26" height="16" rx="4" fill="#eaf2fd"/>
<rect x="364" y="106" width="4" height="16" rx="2" fill="#2a78d6"/>
<text x="400" y="119" font-size="12.5" fill="#52514e">Webカタログ上で完結すること</text>
