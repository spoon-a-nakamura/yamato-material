<text x="84" y="450" font-size="14" fill="#0b0b0b">商品のメーカーを特定する（卸に問い合わせ／資料を探す）</text>
<path d="M257.0,461 L264.0,469 L271.0,461" fill="none" stroke="#87867f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="64" y="474" width="400" height="52" rx="6" fill="#fdeee7"/>
<rect x="64" y="474" width="5" height="52" rx="2.5" fill="#eb6834"/>
