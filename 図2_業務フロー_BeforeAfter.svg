<text x="84" y="516" font-size="14" fill="#0b0b0b">メーカーのサイトから図面を探して印刷する</text>
<path d="M257.0,527 L264.0,535 L271.0,527" fill="none" stroke="#87867f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="64" y="540" width="400" height="52" rx="6" fill="#fdeee7"/>
<rect x="64" y="540" width="5" height="52" rx="2.5" fill="#eb6834"/>
