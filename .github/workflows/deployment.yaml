name: Deploy static site

on:
  push:
    branches:
      - main

# このリポジトリはモノレポで、ルートに package.json が無い。
#   proposal/  提案書デッキ（Astro）         → dist/
#   demo/      Webカタログ（Next.js export） → out/
# そのため各ステップで working-directory を指定し、FTPS の送信先も分ける。
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # lockfile があるので npm ci を使う（npm install と違い lockfile 通りに入る）
      - name: build deck
        working-directory: ./proposal
        run: |
          npm ci
          npm run build

      - name: build webcatalog
        working-directory: ./demo
        run: |
          npm ci
          npm run build

      - name: sync deck
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPS_SERVER }}
          username: ${{ secrets.FTPS_USERNAME }}
          password: ${{ secrets.FTPS_PASSWORD }}
          protocol: ftps
          local-dir: ./proposal/dist/
          server-dir: ./yamato-material/proposal/

      - name: sync webcatalog
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPS_SERVER }}
          username: ${{ secrets.FTPS_USERNAME }}
          password: ${{ secrets.FTPS_PASSWORD }}
          protocol: ftps
          local-dir: ./demo/out/
          server-dir: ./yamato-material/demo/
